[project]
name = "dehyd"
version = "0.1.0"
description = "Radar-based dehydration monitoring — Python rebuild and rigorous extension"
requires-python = ">=3.11"

# Pinned lower bounds only here; exact versions are frozen in uv.lock.
# h5py was added at milestone 2 (77 GHz audit); torch at milestone 4 (WST
# numpy/torch cross-backend validation). NOTE: torch must NOT drag scipy past the
# <1.17 pin below (kymatio 0.3.0 breaks) — verified at M4, torch 2.13.0 resolves
# with scipy 1.16.3. kymatio's torch frontend is float32-only, so the cross-backend
# check compares numpy-float64 against torch-float32 (still within the strict
# tolerance; see MILESTONE_4_PLAN §2.2 and HISTORY).
dependencies = [
    "numpy>=1.26",
    # Upper bound forced by kymatio 0.3.0: its scattering3d filter bank imports
    # scipy.special.sph_harm, which scipy removed in 1.17 (replaced by sph_harm_y).
    # Without this, `from kymatio.numpy import Scattering1D` raises ImportError.
    # Revisit when kymatio ships a release that uses sph_harm_y.
    "scipy>=1.11,<1.17",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "kymatio>=0.3",
    "h5py>=3.16.0",
    "torch>=2.13.0",
    # Added at milestone 7 for the Exp A predicted-vs-actual scatter. Rendered via the
    # headless Agg backend (no display). matplotlib has no scipy dependency, so it does
    # NOT disturb the scipy <1.17 pin above (verified at M7).
    "matplotlib>=3.7",
]

[dependency-groups]
dev = ["pytest>=8.0", "packaging>=21.0"]

# --- CUDA variant pin for the Exp D deep-learning baselines (milestone 9 step 10) -----
# PyPI's default linux `torch` wheel is the CUDA 13 build (`2.13.0+cu130`). IBEX's GPU
# nodes run driver 570.86.15 = CUDA 12.8 (measured 2026-08-01 on the generic and a100
# partitions), and PyTorch tolerates minor driver skew but not the 12 -> 13 major jump, so
# the default wheel aborts with "NVIDIA driver on your system is too old (found version
# 12080)" the moment it touches a GPU.
#
# cu126 rather than cu128/cu129: 2.13.0 ships no cu128 build (that index stops at 2.11.0),
# and a cu129 build on a 12.8 driver would lean on CUDA minor-version FORWARD compatibility.
# A cu126 build on a 12.8 driver is plain backward compatibility — driver newer than
# toolkit — which is unambiguous. The torch VERSION is unchanged at 2.13.0, so the
# `torch>=2.13.0` pin above and the M4 cross-backend tolerance both stand; only the bundled
# CUDA runtime differs.
#
# Scoped to linux so a non-IBEX checkout resolves from PyPI exactly as before. The
# `scipy<1.17` bound above is the thing this must not disturb: re-locking was verified to
# leave numpy/scipy/kymatio at their previous versions (HISTORY 2026-08-01).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dehyd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default .pytest_cache/ at the repo root exists with an unreadable ACL on this
# machine (cannot be read, chown'd, or removed without elevation), which makes pytest
# emit a PytestCacheWarning on every run. Point the cache somewhere writable instead.
cache_dir = ".cache/pytest"
markers = [
    # Registration only silences the unknown-marker warning; the actual gating
    # (skip by default, hard-fail under --realdata) lives in tests/conftest.py.
    "realdata: requires the private raw dataset; skipped unless --realdata is passed",
]
