# Experiment A — fluid-loss (Delta m%) regression, session-level, nested LOSO.
#
# Composes the shared configs so no scientific constant is duplicated. Include paths
# resolve against THIS file's directory; path values inside resolve against the repo
# root. A per-machine overlay (e.g. configs/ibex.yaml) is passed as a later --config.
include:
  - data.yaml
  - preprocess.yaml
  - wst.yaml
  - search_10ghz.yaml   # the frozen Exp A/WST search space + model grids (milestone 6)

run:
  seed: 20260721
  # Five distinct seeds for stochastic models; the inner metric is their mean and each
  # seed is scored separately at the outer level (never ensembled into one prediction).
  seed_set: [1, 2, 3, 4, 5]
  device: cpu

split:
  n_inner_max: 5        # GroupKFold(min(5, n_train)) over outer-training subjects
  min_train_subjects: 3 # below this an outer fold is non-selectable, not degenerate

# The Exp A search space was frozen at the milestone-6 config-freeze gate (search_10ghz.yaml,
# included above; src/dehyd/config.py SearchSpace10GHzConfig), before any outer results were
# inspected. The staged-search order and per-family budget K are frozen there too.
